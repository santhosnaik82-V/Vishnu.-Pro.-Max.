name: Build VISHNU PRO MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Repository contents:"
          ls -la
          if [ ! -f source.zip ]; then
            echo "ERROR: source.zip is missing from the repository root."
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q source.zip -d source

      - name: Locate Gradle Wrapper
        id: locate
        shell: bash
        run: |
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew file found in source.zip."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          chmod +x "$WRAPPER"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VISHNU-PRO-MAX-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
